<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de personagem</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="principal">
        <div class="info-gerais">


            <div class="nome-jogador">
                <p>Nome do jogador:</p>
                <input type="text">
            </div>

            <div class="nome-personagem">
                <p>Nome do personagem:</p>
                <input type="text">
            </div>

            <div class="raca">
                <p>Raça:</p>
                <select name="" id="">
                    <option value="none" selected disabled></option>
                    <option value="goblin">Goblin</option>
                    <option value="elfo">Elfo</option>
                    <option value="vampiro">Vampiro</option>
                    <option value="gigante">Gigante</option>
                    <option value="morto-vivo">Morto vivo</option>
                    <option value="draconico">Dracônico</option>
                    <option value="demonio">Demônio</option>
                    <option value="anjo">Anjo</option>
                    <option value="anao">Anão</option>
                    <option value="humano">Humano</option>
                </select>
            </div>

            <div class="classe">
                <p>Classe:</p>
                <select name="" id="">
                    <option value="none" selected disabled></option>
                    <option value="arqueiro">Arqueiro</option>
                    <option value="armeiro">Armeiro</option>
                    <option value="ferreiro">Ferreiro</option>
                    <option value="mago">Mago</option>
                    <option value="guerreiro">Guerreiro</option>
                    <option value="cavalheiro">Cavalheiro</option>
                    <option value="piromaniaco">Piromaníaco</option>
                </select>
            </div>

        </div>

        <div class="info-status">
            <div class="hp">
                <p>HP:</p>
                <input type="number" name="" id="">
            </div>

            <div class="destreza">
                <p>Destreza:</p>
                <input type="number" name="" id="">
            </div>

            <div class="estamina">
                <p>Estamina:</p>
                <input type="number" name="" id="">
            </div>

            <div class="fe">
                <p>Fé:</p>
                <input type="number" name="" id="">
            </div>

            <div class="defesa">
                <p>Defesa:</p>
                <input type="number" name="" id="">
            </div>

            <div class="forca">
                <p>Força:</p>
                <input type="number" name="" id="">
            </div>

            <div class="resistencia">
                <p>Resistência:</p>
                <input type="number" name="" id="">
            </div>

            <div class="pontos-de-mana">
                <p>Pontos de mana:</p>
                <input type="number" name="" id="">
            </div>
        </div>

        <div class="info-inventario">
            <div class="inventario">
                <p>inventario</p>
                <textarea name="" id="" cols="15" rows="10"></textarea>
            </div>
            <div class="imagem">
                <p>imagem</p>
                <textarea name="" id="" cols="15" rows="10"></textarea>
            </div>
            
            <div class="bibliografia">
                <p>bibliografia</p>
                <textarea name="" id="" cols="15" rows="10"></textarea>
            </div>

        </div>

</body>

</html>
